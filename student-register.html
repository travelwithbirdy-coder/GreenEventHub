<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — NSBM EventHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="siteHeader">
  <div class="siteHeaderInner">
    <a href="index.html" class="brandMark">Event<span>Hub</span></a>
    <nav class="mainNav">
      <a href="student-login.html">Student Login</a>
      <a href="admin-login.html">Admin Login</a>
    </nav>
  </div>
</header>

<main class="authSplit">
  <div class="authArtPanel artMarigold">
    <div class="authArtInner">
      <p class="authArtKicker">NSBM University</p>
      <h1 class="authArtBrand">Event<span>Hub</span></h1>
      <p class="authArtLead">Register once to browse and reserve seats at NSBM events.</p>
      <img src="assets/student-auth-art.svg" alt="Illustration of an event ticket surrounded by confetti">
      <p class="authArtCaption">One account, every club event on campus.</p>
    </div>
  </div>

  <div class="authFormPanel">
    <div class="formCard" style="border:none;padding:0;text-align:left;">
      <h2>Create your student account</h2>
      <p style="margin-bottom:24px;">Register once to browse and reserve seats at NSBM events.</p>

      <div id="registerMsgBox" class="msgBox"></div>

      <form id="studentRegisterForm">
        <div class="formRow">
          <label for="regFullName">Full name</label>
          <input type="text" id="regFullName" name="regFullName" placeholder="e.g. Nadeesha Perera">
        </div>
        <div class="formRow">
          <label for="regStudentId">Student ID</label>
          <input type="text" id="regStudentId" name="regStudentId" placeholder="e.g. COBSCCOMP26.1-001">
        </div>
        <div class="formRow">
          <label for="regEmail">NSBM email</label>
          <input type="email" id="regEmail" name="regEmail" placeholder="you@students.nsbm.ac.lk">
        </div>
        <div class="formRow">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" name="regPassword" placeholder="At least 6 characters">
        </div>
        <div class="formRow">
          <label for="regConfirmPassword">Confirm password</label>
          <input type="password" id="regConfirmPassword" name="regConfirmPassword">
        </div>
        <button type="submit" class="btn btnPrimary btnFull">Create account</button>
      </form>

      <p class="formFooterNote">Already have an account? <a href="student-login.html">Log in here</a>.</p>
    </div>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById("studentRegisterForm").addEventListener("submit", handleStudentRegisterSubmit);
</script>
</body>
</html>
