<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login — NSBM EventHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="siteHeader">
  <div class="siteHeaderInner">
    <a href="index.html" class="brandMark">Event<span>Hub</span></a>
    <nav class="mainNav">
      <a href="student-register.html">Create Account</a>
      <a href="admin-login.html">Admin Login</a>
    </nav>
  </div>
</header>

<main class="authSplit">
  <div class="authArtPanel artMarigold">
    <div class="authArtInner">
      <p class="authArtKicker">NSBM University</p>
      <h1 class="authArtBrand">Event<span>Hub</span></h1>
      <p class="authArtLead">Plan, publish, and register for every club event on campus — all in one place.</p>
      <img src="assets/student-auth-art.svg" alt="Illustration of an event ticket surrounded by confetti">
      <p class="authArtCaption">Your next campus event is a click away.</p>
    </div>
  </div>

  <div class="authFormPanel">
    <div class="formCard" style="border:none;padding:0;">
      <h2>Sign in</h2>
      <div class="loginModeToggle">
        <a href="student-login.html" class="isActive">Student</a>
        <a href="admin-login.html">Admin</a>
      </div>
      <p style="margin-bottom:24px;">Log in to browse events and view your schedule.</p>

      <div id="loginMsgBox" class="msgBox"></div>

      <form id="studentLoginForm">
        <div class="formRow">
          <label for="loginEmail">NSBM email</label>
          <input type="email" id="loginEmail" name="loginEmail" placeholder="you@students.nsbm.ac.lk">
        </div>
        <div class="formRow">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" name="loginPassword">
        </div>
        <button type="submit" class="btn btnPrimary btnFull">Log in</button>
      </form>

      <p class="formFooterNote">New here? <a href="student-register.html">Create an account</a>.</p>
    </div>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById("studentLoginForm").addEventListener("submit", handleStudentLoginSubmit);
</script>
</body>
</html>
