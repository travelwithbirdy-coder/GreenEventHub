<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcements — NSBM EventHub Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="siteHeader">
  <div class="siteHeaderInner">
    <a href="admin-dashboard.html" class="brandMark">Event<span>Hub</span> <span style="font-size:0.6rem;color:var(--teal-dark);font-weight:600;">ADMIN</span></a>
    <nav class="mainNav">
      <span class="navUserPill" id="adminNavPill"></span>
      <a href="#" onclick="logoutAdmin(); return false;">Log out</a>
    </nav>
  </div>
</header>

<div class="adminShell">
  <aside class="adminSidebar">
    <a href="admin-dashboard.html">Dashboard</a>
    <a href="admin-events.html">Events</a>
    <a href="admin-categories.html">Categories</a>
    <a href="admin-registrations.html">Registrations</a>
    <a href="admin-announcements.html" class="navActive">Announcements</a>
  </aside>

  <main class="adminMain">
    <div class="sectionHead">
      <div>
        <h1 style="font-size:1.8rem;">Announcements</h1>
        <p>Post updates that students will see on their announcements page.</p>
      </div>
    </div>

    <form id="announcementForm" class="formCard formCardWide" style="margin-bottom:32px;">
      <div class="formRow">
        <label for="announceTitleInput">Title</label>
        <input type="text" id="announceTitleInput" required placeholder="e.g. Venue change for the workshop">
      </div>
      <div class="formRow">
        <label for="announceMessageInput">Message</label>
        <textarea id="announceMessageInput" required placeholder="Details students need to know"></textarea>
      </div>
      <button type="submit" class="btn btnPrimary">Post announcement</button>
    </form>

    <div id="adminAnnouncementList" style="max-width:680px;"></div>
  </main>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
<script>
  initAdminAnnouncementsPage();
</script>
</body>
</html>
