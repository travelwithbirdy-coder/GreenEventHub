<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrations — NSBM EventHub Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  @media print {
    .siteHeader, .adminSidebar, .filterBar, .noPrint { display: none !important; }
    .adminMain { padding: 0; }
  }
</style>
</head>
<body>

<header class="siteHeader">
  <div class="siteHeaderInner">
    <a href="admin-dashboard.html" class="brandMark">Event<span>Hub</span> <span style="font-size:0.6rem;color:var(--teal-dark);font-weight:600;">ADMIN</span></a>
    <nav class="mainNav">
      <span class="navUserPill" id="adminNavPill"></span>
      <a href="#" onclick="logoutAdmin(); return false;">Log out</a>
    </nav>
  </div>
</header>

<div class="adminShell">
  <aside class="adminSidebar">
    <a href="admin-dashboard.html">Dashboard</a>
    <a href="admin-events.html">Events</a>
    <a href="admin-categories.html">Categories</a>
    <a href="admin-registrations.html" class="navActive">Registrations</a>
    <a href="admin-announcements.html">Announcements</a>
  </aside>

  <main class="adminMain">
    <div class="sectionHead">
      <div>
        <h1 style="font-size:1.8rem;">Registrations</h1>
        <p>See who has registered for an event and print the participant list.</p>
      </div>
    </div>

    <div class="filterBar">
      <div>
        <label for="registrationEventSelect">Event</label>
        <select id="registrationEventSelect">
          <option value="">Choose an event</option>
        </select>
      </div>
      <span id="participantCount" class="muted" style="margin-left:auto;"></span>
      <button class="btn btnGhost btnSmall noPrint" onclick="printParticipantList()">Print list</button>
    </div>

    <div id="participantListEmpty" class="emptyState"></div>

    <div class="adminTableWrap">
      <table class="adminTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Student name</th>
            <th>Student ID</th>
            <th>Email</th>
            <th>Registered on</th>
          </tr>
        </thead>
        <tbody id="participantTableBody"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
<script>
  initAdminRegistrationsPage();
</script>
</body>
</html>
