<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Events — NSBM EventHub Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="siteHeader">
  <div class="siteHeaderInner">
    <a href="admin-dashboard.html" class="brandMark">Event<span>Hub</span> <span style="font-size:0.6rem;color:var(--teal-dark);font-weight:600;">ADMIN</span></a>
    <nav class="mainNav">
      <span class="navUserPill" id="adminNavPill"></span>
      <a href="#" onclick="logoutAdmin(); return false;">Log out</a>
    </nav>
  </div>
</header>

<div class="adminShell">
  <aside class="adminSidebar">
    <a href="admin-dashboard.html">Dashboard</a>
    <a href="admin-events.html" class="navActive">Events</a>
    <a href="admin-categories.html">Categories</a>
    <a href="admin-registrations.html">Registrations</a>
    <a href="admin-announcements.html">Announcements</a>
  </aside>

  <main class="adminMain">
    <div class="sectionHead">
      <div>
        <h1 style="font-size:1.8rem;">Events</h1>
        <p>Create, edit and remove events.</p>
      </div>
      <button class="btn btnPrimary" onclick="openEventFormForCreate()">Add new event</button>
    </div>

    <div id="eventFormPanel" class="formCard formCardWide" style="display:none;margin-bottom:32px;">
      <h3 id="eventFormTitle">Add a new event</h3>
      <form id="eventForm">
        <input type="hidden" id="editingEventId">
        <div class="formRow">
          <label for="eventTitleInput">Event title</label>
          <input type="text" id="eventTitleInput" required placeholder="e.g. AI & Robotics Expo 2026">
        </div>
        <div class="formGrid2">
          <div class="formRow">
            <label for="eventCategorySelect">Category</label>
            <select id="eventCategorySelect" required></select>
          </div>
          <div class="formRow">
            <label for="eventCapacityInput">Capacity (seats)</label>
            <input type="number" id="eventCapacityInput" min="1" required placeholder="e.g. 100">
          </div>
        </div>
        <div class="formGrid2">
          <div class="formRow">
            <label for="eventDateInput">Date</label>
            <input type="date" id="eventDateInput" required>
          </div>
          <div class="formRow">
            <label for="eventTimeInput">Time</label>
            <input type="time" id="eventTimeInput" required>
          </div>
        </div>
        <div class="formRow">
          <label for="eventVenueInput">Venue</label>
          <input type="text" id="eventVenueInput" required placeholder="e.g. Auditorium A">
        </div>
        <div class="formRow">
          <label for="eventOrganizerInput">Organised by</label>
          <input type="text" id="eventOrganizerInput" required placeholder="e.g. IEEE Student Chapter">
        </div>
        <div class="formRow">
          <label for="eventDescriptionInput">Description</label>
          <textarea id="eventDescriptionInput" required placeholder="What should students expect at this event?"></textarea>
        </div>
        <div class="portalActions">
          <button type="submit" class="btn btnPrimary">Save event</button>
          <button type="button" class="btn btnGhost" onclick="closeEventForm()">Cancel</button>
        </div>
      </form>
    </div>

    <div class="adminTableWrap">
      <table class="adminTable">
        <thead>
          <tr>
            <th>Event</th>
            <th>Category</th>
            <th>Date</th>
            <th>Registered</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="eventTableBody"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
<script>
  initAdminEventsPage();
</script>
</body>
</html>
