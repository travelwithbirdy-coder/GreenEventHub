<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — NSBM EventHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="siteHeader">
  <div class="siteHeaderInner">
    <a href="index.html" class="brandMark">Event<span>Hub</span></a>
    <nav class="mainNav">
      <a href="student-login.html">Student Login</a>
    </nav>
  </div>
</header>

<main class="authSplit">
  <div class="authArtPanel artTeal">
    <div class="authArtInner">
      <p class="authArtKicker">NSBM University</p>
      <h1 class="authArtBrand">Event<span>Hub</span></h1>
      <p class="authArtLead">Plan, publish, and manage every club event on campus — all in one place.</p>
      <img src="assets/admin-auth-art.svg" alt="Illustration of a clipboard with a checklist and a small bar chart">
      <p class="authArtCaption">Run every event from one dashboard.</p>
    </div>
  </div>

  <div class="authFormPanel">
    <div class="formCard" style="border:none;padding:0;">
      <h2>Sign in</h2>
      <div class="loginModeToggle">
        <a href="student-login.html">Student</a>
        <a href="admin-login.html" class="isActive">Admin</a>
      </div>
      <p style="margin-bottom:24px;">For event organisers and club administrators.</p>

      <div id="adminLoginMsgBox" class="msgBox"></div>

      <form id="adminLoginForm">
        <div class="formRow">
          <label for="adminUsername">Username</label>
          <input type="text" id="adminUsername" name="adminUsername" placeholder="admin">
        </div>
        <div class="formRow">
          <label for="adminPassword">Password</label>
          <input type="password" id="adminPassword" name="adminPassword">
        </div>
        <button type="submit" class="btn btnTeal btnFull">Log in</button>
      </form>

      <p class="formFooterNote">Demo login — username <strong>admin</strong>, password <strong>admin123</strong>.</p>
    </div>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById("adminLoginForm").addEventListener("submit", handleAdminLoginSubmit);
</script>
</body>
</html>
